<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="648" viewBox="0 0 1120 648" role="img" aria-labelledby="title description">
  <title id="title">Reading, editing and saving audio metadata</title>
  <desc id="description">MediaFile.open reads a local file with parseFile. APEv2, Vorbis comments and ID3v2.3 illustrate how native tags map to common title, artist and album fields. After optional edits, file.save passes the common tags to updateFile for the same path. The writer preserves the audio and writes the container's conventional tags. For an MP3 with ID3v2.3, explicit ID3 replacement writes ID3v2.4.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b3a; }
      .heading { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #43586a; }
      .format { font-size: 21px; font-weight: 700; }
      .tag-format { font-size: 18px; fill: #43586a; }
      .fields { font-family: 'DejaVu Sans Mono', Consolas, monospace; font-size: 18px; }
      .common-field { font-family: 'DejaVu Sans Mono', Consolas, monospace; font-size: 21px; }
      .step { font-size: 16px; font-weight: 700; }
      .api { font-family: 'DejaVu Sans Mono', Consolas, monospace; font-size: 15px; }
      .note { font-size: 18px; fill: #43586a; }
      .read-line { fill: none; stroke: #326b9b; stroke-width: 2.5; stroke-linejoin: round; }
      .write-line { fill: none; stroke: #965218; stroke-width: 2.5; stroke-linejoin: round; }
    </style>
    <marker id="read-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#326b9b"/>
    </marker>
    <marker id="edit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#33765b"/>
    </marker>
    <marker id="write-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#965218"/>
    </marker>
  </defs>

  <!-- A fixed light background keeps the diagram readable in light and dark READMEs. -->
  <rect width="1120" height="648" rx="16" fill="#ffffff"/>
  <rect x="16" y="16" width="304" height="584" rx="14" fill="#eef5fc" stroke="#c8dcee"/>
  <rect x="400" y="16" width="304" height="584" rx="14" fill="#eff8f3" stroke="#c6e2d2"/>
  <rect x="784" y="16" width="320" height="584" rx="14" fill="#fff5eb" stroke="#ecd4bc"/>

  <!-- Three stages, with alternatives shown on each side. -->
  <text x="36" y="58" class="heading">Input tags</text>
  <text x="36" y="89" class="subtitle">Native tags in the file</text>
  <text x="420" y="58" class="heading">MediaFile</text>
  <text x="420" y="89" class="subtitle">Editable metadata for one file</text>
  <text x="804" y="58" class="heading">Output tags</text>
  <text x="804" y="89" class="subtitle">Conventional tags in the same file</text>

  <!-- Read-side native tags. Field order corresponds to the common fields. -->
  <g>
    <rect x="32" y="160" width="272" height="126" rx="10" fill="#ffffff" stroke="#b8cfe2"/>
    <text x="48" y="195" class="format">Monkey's Audio / APE</text>
    <text x="48" y="224" class="tag-format">APEv2</text>
    <text x="48" y="261" class="fields">Title · Artist · Album</text>
  </g>
  <g>
    <rect x="32" y="310" width="272" height="126" rx="10" fill="#ffffff" stroke="#b8cfe2"/>
    <text x="48" y="345" class="format">FLAC</text>
    <text x="48" y="374" class="tag-format">Vorbis comments</text>
    <text x="48" y="411" class="fields">TITLE · ARTIST · ALBUM</text>
  </g>
  <g>
    <rect x="32" y="460" width="272" height="126" rx="10" fill="#ffffff" stroke="#b8cfe2"/>
    <text x="48" y="495" class="format">MP3</text>
    <text x="48" y="524" class="tag-format">ID3v2.3</text>
    <text x="48" y="561" class="fields">TIT2 · TPE1 · TALB</text>
  </g>

  <!-- Read paths converge on a single normalized representation. -->
  <path class="read-line" d="M 304 223 H 352 V 523 H 304 M 304 373 H 352"/>
  <path class="read-line" d="M 352 300 H 416" marker-end="url(#read-arrow)"/>
  <rect x="322" y="257" width="77" height="27" rx="4" fill="#ffffff"/>
  <text x="360" y="278" text-anchor="middle" class="step">Normalize</text>
  <rect x="317" y="311" width="86" height="24" rx="4" fill="#ffffff"/>
  <text x="360" y="328" text-anchor="middle" class="api">parseFile</text>

  <!-- Normalization is a read result, not an implicit write patch. -->
  <rect x="416" y="192" width="272" height="188" rx="10" fill="#ffffff" stroke="#8dbba0"/>
  <text x="436" y="223" class="api">MediaFile.open(path)</text>
  <text x="436" y="255" class="common-field" font-weight="700">metadata.common</text>
  <line x1="436" y1="270" x2="668" y2="270" stroke="#d4e8dc"/>
  <text x="436" y="300" class="common-field">title</text>
  <text x="436" y="331" class="common-field">artist</text>
  <text x="436" y="362" class="common-field">album</text>

  <path d="M 552 380 V 474" fill="none" stroke="#33765b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#edit-arrow)"/>
  <text x="568" y="420" class="subtitle">Edit values</text>
  <text x="568" y="444" class="subtitle">as needed</text>
  <rect x="416" y="474" width="272" height="100" rx="10" fill="#ffffff" stroke="#8dbba0"/>
  <text x="436" y="511" class="api">file.save(options)</text>
  <text x="436" y="545" class="subtitle">Apply common tags as a patch</text>

  <!-- Write paths are alternatives chosen by the file's audio format. -->
  <path class="write-line" d="M 688 524 H 752 V 223"/>
  <path class="write-line" d="M 752 223 H 800" marker-end="url(#write-arrow)"/>
  <path class="write-line" d="M 752 373 H 800" marker-end="url(#write-arrow)"/>
  <path class="write-line" d="M 752 523 H 800" marker-end="url(#write-arrow)"/>
  <rect x="705" y="419" width="78" height="26" rx="4" fill="#ffffff"/>
  <text x="746" y="439" text-anchor="middle" class="step">Map fields</text>
  <rect x="698" y="447" width="96" height="24" rx="4" fill="#ffffff"/>
  <text x="746" y="463" text-anchor="middle" class="api">updateFile</text>

  <g>
    <rect x="800" y="160" width="288" height="126" rx="10" fill="#ffffff" stroke="#dcbf9e"/>
    <text x="816" y="195" class="format">Monkey's Audio / APE</text>
    <text x="816" y="224" class="tag-format">APEv2</text>
    <text x="816" y="261" class="fields">Title · Artist · Album</text>
  </g>
  <g>
    <rect x="800" y="310" width="288" height="126" rx="10" fill="#ffffff" stroke="#dcbf9e"/>
    <text x="816" y="345" class="format">FLAC</text>
    <text x="816" y="374" class="tag-format">Vorbis comments</text>
    <text x="816" y="411" class="fields">TITLE · ARTIST · ALBUM</text>
  </g>
  <g>
    <rect x="800" y="460" width="288" height="126" rx="10" fill="#ffffff" stroke="#dcbf9e"/>
    <text x="816" y="495" class="format">MP3</text>
    <text x="816" y="524" class="tag-format">ID3v2.4</text>
    <text x="816" y="561" class="fields">TIT2 · TPE1 · TALB</text>
  </g>

  <text x="560" y="630" text-anchor="middle" class="note">The writer preserves the audio payload. ID3v2.3 replacement requires replaceId3: true.</text>
</svg>
